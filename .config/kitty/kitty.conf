# ─── Font Settings ──────────────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          13.0
enable_ligatures   yes

# ─── Transparency & Blur (Requires compositor) ─────────────────
background_opacity        0.85
dynamic_background_opacity yes
inactive_opacity          0.75

# ─── Window & Tabs ─────────────────────────────────────────────
window_padding_width      0
margin_width              0
tab_bar_edge              top
tab_title_format          {title}
window_decorations        none
startup_mode              fullscreen
# If using sway/hyprland, comment below:
startup_window            1

# ─── Performance & Scrolling ───────────────────────────────────
use_gpu                   yes
scrollback_lines          10000
scroll_multiplier         3
input_delay               0
repaint_delay             2
sync_to_monitor           no

# ─── Key Bindings ──────────────────────────────────────────────
map ctrl+shift+f find_text
map ctrl+shift+t new_tab

# ─── URL Handling ──────────────────────────────────────────────
url_launcher              open

# ─── Notifications ─────────────────────────────────────────────
bell                      on

# ─── IME Settings ──────────────────────────────────────────────
wayland_enable_ime        no

