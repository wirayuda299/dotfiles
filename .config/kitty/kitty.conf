# Kitty Configuration File with Nerd Font

# -------------------------------
# Font Settings (using a Nerd Font)
# font_family "JetBrainsMono Nerd Font"
bold_font "JetBrainsMono Nerd Font Bold"
italic_font "JetBrainsMono Nerd Font Italic"
bold_italic_font "JetBrainsMono Nerd Font Bold Italic"
font_size 13
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_ligatures yes

# -------------------------------
# Color Scheme (Catppuccin Macchiato)
# -------------------------------
background       #24273A
foreground       #CAD3F5
cursor          #F4DBD6
selection_bg    #363A4F
selection_fg    #F4DBD6

color0  #494D64
color1  #ED8796
color2  #A6DA95
color3  #EED49F
color4  #8AADF4
color5  #C6A0F6
color6  #8BD5CA
color7  #B8C0E0
color8  #5B6078
color9  #ED8796
color10 #A6DA95
color11 #EED49F
color12 #8AADF4
color13 #C6A0F6
color14 #8BD5CA
color15 #A5ADCB

# -------------------------------
# Window & Tab Settings
# -------------------------------
# window_padding_width 0
margin_width 0
window_padding_width 0.0
tab_bar_edge top
tab_title_format {title}
dynamic_background_opacity yes
background_opacity 1
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

# -------------------------------
# Scrollback and Performance
# -------------------------------
scrollback_lines 10000
use_gpu yes
scroll_multiplier 3

# -------------------------------
# Miscellaneous Settings
# -------------------------------
bell on
inactive_opacity 1

# -------------------------------
# Custom Keybindings (Optional)
# -------------------------------
map ctrl+shift+f find_text
map ctrl+shift+t new_tab

# -------------------------------
# URL Handling
# -------------------------------
url_launcher open

# -------------------------------
# Startup Options
# --------- ----------------------
startup_window 1
startup_mode fullscreen
window_decorations none
windowrule fullscreen, class:kitty


# End of kitty.conf

