# Alacritty Configuration with Optimizations
# Copy this to ~/.config/alacritty/alacritty.toml

# Optimization settings for faster startup
[optimizations]
# Enable ultra-fast startup mode (disables some features)
fast_startup = true

# Enable deferred glyph loading
deferred_glyphs = true

# Enable deferred IPC socket creation
deferred_ipc = true

# Enable deferred font loading (bold/italic variants)
deferred_fonts = true

# Enable deferred OpenGL setup
deferred_opengl = true

# Enable minimal logging during startup
minimal_logging = true

# Enable minimal window setup
minimal_window = true

# Enable minimal PTY setup
minimal_pty = true

# Enable reduced terminal grid cache
reduced_grid_cache = true

# For Neovim users who need full functionality, set these to false:
# deferred_glyphs = false
# deferred_fonts = false
# minimal_logging = false

# Window configuration
[window]
opacity = 0.9
dynamic_title = true
decorations = "full"
padding = { x = 0, y = 0 }

# Font configuration
[font]
size = 12
normal.family = "JetBrains Mono"
normal.style = "Regular"

# Colors
[colors]
primary.background = "#1e1e1e"
primary.foreground = "#d4d4d4" 
