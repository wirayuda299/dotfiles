# Minimal Alacritty config
[window]
padding = { x = 0, y = 0 }
opacity = 0.95

[font]
size = 13.0
#
# [font.normal]
# family = "JetBrainsMono Nerd Font Mono"
# style = "Regular"
#
[colors.primary]
background = "#1e1e1e"
foreground = "#d4d4d4"
 
[colors.normal]
black = "#1e1e1e"
red = "#f44747"
green = "#4ec9b0"
yellow = "#ffcc02"
blue = "#3794ff"
magenta = "#b267e6"
cyan = "#4ec9b0"
white = "#d4d4d4"

[cursor]
style = { shape = "Block" }

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
]
